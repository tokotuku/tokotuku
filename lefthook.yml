pre-commit:
  parallel: true
  commands:
    biome-check:
      glob: "*.{ts,tsx,js,mjs,cjs,json,jsonc,css}"
      run: bun run biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    conventional-commit:
      run: bun scripts/verify-commit-msg.ts {1}
