name: Sync starter repository

on:
  push:
    branches: [master]
    paths:
      - "template/**"
      - ".github/workflows/sync-starter.yml"
  workflow_dispatch:

concurrency:
  group: sync-starter
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync template to starter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Tokotuku
        uses: actions/checkout@v7
        with:
          path: source

      - name: Checkout starter repository
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/tokotuku-starter
          ref: main
          token: ${{ secrets.STARTER_REPO_TOKEN }}
          path: starter

      - name: Copy template
        run: |
          rsync -a --delete \
            --exclude=".git/" \
            source/template/ starter/

      - name: Commit and push
        working-directory: starter
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git config user.name "tokotuku-bot"
          git config user.email "tokotuku-bot@users.noreply.github.com"

          git add --all

          if git diff --cached --quiet; then
            echo "Starter is already up to date."
            exit 0
          fi

          short_sha="${SOURCE_SHA:0:7}"
          git commit -m "chore: sync starter from tokotuku@${short_sha}"
          git push origin main
