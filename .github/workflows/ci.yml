name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Setup moon toolchain
        uses: moonrepo/setup-toolchain@v0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run affected lint, typecheck, and build
        run: moon ci :lint :typecheck :build
        env:
          MOON_BASE: origin/main
