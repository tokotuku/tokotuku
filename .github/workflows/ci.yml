name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Setup moon toolchain
        uses: moonrepo/setup-toolchain@v0

      - name: Validate lockfile registry
        run: |
          if grep -Eq 'https?://(localhost|127\.0\.0\.1):4873' bun.lock; then
            echo "bun.lock contains local Verdaccio URLs; regenerate it against npmjs." >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile
        timeout-minutes: 10

      - name: Run affected lint, typecheck, test, and build
        run: moon ci :lint :typecheck :test :build
        env:
          MOON_BASE: origin/main

  e2e-install:
    name: "Gates 1-3 + update propagation + demo"
    runs-on: ubuntu-latest
    services:
      verdaccio:
        image: verdaccio/verdaccio:6
        ports:
          - 4873:4873
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Setup moon toolchain
        uses: moonrepo/setup-toolchain@v0

      - name: Validate lockfile registry
        run: |
          if grep -Eq 'https?://(localhost|127\.0\.0\.1):4873' bun.lock; then
            echo "bun.lock contains local Verdaccio URLs; regenerate it against npmjs." >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile
        timeout-minutes: 10

      # workspace:* symlinks hide broken exports maps, missing "files"
      # entries, missing peerDependencies, and node_modules module
      # resolution failures -- all of which only surface once packages are
      # actually installed from tarballs. See tools/e2e-install/README.md.
      - name: Create Verdaccio user and configure .npmrc
        timeout-minutes: 2
        run: |
          for attempt in {1..30}; do
            if curl -fsS http://localhost:4873/-/ping >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Verdaccio did not become ready within 30 seconds." >&2
              exit 1
            fi
            sleep 1
          done

          TOKEN=$(curl -sf -X PUT http://localhost:4873/-/user/org.couchdb.user:ci \
            -H "Content-Type: application/json" \
            -d '{"name":"ci","password":"ci-throwaway-password"}' \
            | jq -r .token)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Verdaccio did not return an authentication token." >&2
            exit 1
          fi
          cat > .npmrc <<EOF
          @takontuku:registry=http://localhost:4873
          registry=http://localhost:4873
          //localhost:4873/:_authToken=${TOKEN}
          EOF

      - name: Run Gate 1 (tarball install)
        run: moon run e2e-install:run
        env:
          REGISTRY_URL: http://localhost:4873

      # Gate 1 only proves "everything installed" works. This is the gate
      # that proves the a-la-carte seam itself, by asserting an optional
      # module's absence leaves zero trace -- a green Gate 1 alone proves
      # nothing about that. See tools/e2e-install/README.md.
      - name: Run Gate 2 (a-la-carte fixture)
        run: moon run e2e-install:fixtures
        env:
          REGISTRY_URL: http://localhost:4873

      # The scenario a real client actually hits: they run with a subset of
      # modules and real data, then add one later. Catches migration
      # numbering regressions Gate 1/2 can't, since both always start fresh.
      - name: Run Gate 2b (add a module later with existing data)
        run: moon run e2e-install:upgrade
        env:
          REGISTRY_URL: http://localhost:4873

      # The golden path a real customer and admin actually walk. Gates
      # 1/2/2b only prove the package graph installs and migrates; none of
      # them click through the application.
      - name: Run Gate 3 (runtime smoke test)
        run: moon run e2e-install:smoke
        env:
          REGISTRY_URL: http://localhost:4873

      # The verification slice of Gate 5: proves `bun update` actually
      # propagates a patch to a client, without touching real npm
      # publishing or claiming the @takontuku scope on the public registry.
      # See tools/e2e-install/README.md.
      - name: Run Gate 5 (update propagation)
        run: moon run e2e-install:propagation
        env:
          REGISTRY_URL: http://localhost:4873

      # The concrete client walkthrough: bare install -> seed -> change the
      # design. Neither seeding nor theme overrides are exercised by any
      # other gate.
      - name: Run demo walkthrough (bare install, seed, theme override)
        run: moon run e2e-install:demo
        env:
          REGISTRY_URL: http://localhost:4873

      # Proves takontuku add/remove's rewritten files survive real Biome
      # lint, real astro check, and a real build -- not just this repo's
      # own unit tests' expectations.
      - name: Run modules gate (takontuku add / remove)
        run: moon run e2e-install:modules
        env:
          REGISTRY_URL: http://localhost:4873

  release:
    name: Publish public packages
    needs: [ci, e2e-install]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # This is the whole point: npm trusted publishing (OIDC) lets Actions
      # authenticate to npm with this workflow's own identity, so there is
      # no NPM_TOKEN to store, rotate, or leak. Each package must first be
      # configured on npmjs.com (Settings -> Trusted Publisher) to accept
      # publishes from this repo + workflow file -- until that's done, the
      # publish step below fails on auth, safely, before anything ships.
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Setup moon toolchain
        uses: moonrepo/setup-toolchain@v0

      # `changeset publish` shells out to `npm publish` regardless of this
      # repo's package manager (verified against @changesets/cli's own
      # getPublishTool, which only special-cases pnpm) -- and OIDC trusted
      # publishing needs npm >=11.5.0. actions/setup-node's bundled npm can
      # lag behind that, so upgrade it explicitly rather than trust whatever
      # the runner image happens to ship.
      # Deliberately no `registry-url:` here -- that makes setup-node write
      # an .npmrc auth line referencing $NODE_AUTH_TOKEN, which is exactly
      # the long-lived-token pattern OIDC trusted publishing replaces, and
      # npm errors on that placeholder when the env var is entirely unset
      # rather than just empty. Each package's own publishConfig.registry
      # (already verified in CI to take effect) points publish at npmjs.org
      # without it.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Upgrade npm for trusted publishing support
        run: npm install -g npm@latest

      - name: Validate lockfile registry
        run: |
          if grep -Eq 'https?://(localhost|127\.0\.0\.1):4873' bun.lock; then
            echo "bun.lock contains local Verdaccio URLs; regenerate it against npmjs." >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile
        timeout-minutes: 10

      # @takontuku/catalog and @takontuku/orders stay "private": true in
      # their package.json -- changeset publish skips private packages
      # unconditionally, so they structurally cannot leak here even if this
      # job is misconfigured. See scripts/publish-private.ts for how those
      # two actually get released, manually, to the private registry.
      - name: Build and publish public packages
        run: bun run release

      # Second, independent guard on top of the "private" flag above: fail
      # the job loudly if either private package is somehow reachable on
      # public npm.
      - name: Verify private packages stayed off public npm
        run: |
          for pkg in @takontuku/catalog @takontuku/orders; do
            if npm view "$pkg" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
              echo "$pkg is reachable on public npm -- it must stay private." >&2
              exit 1
            fi
          done
