name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Setup moon toolchain
        uses: moonrepo/setup-toolchain@v0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run affected lint, typecheck, test, and build
        run: moon ci :lint :typecheck :test :build
        env:
          MOON_BASE: origin/main

  e2e-install:
    name: "Gates 1-3 + update propagation"
    runs-on: ubuntu-latest
    services:
      verdaccio:
        image: verdaccio/verdaccio:6
        ports:
          - 4873:4873
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Setup moon toolchain
        uses: moonrepo/setup-toolchain@v0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # workspace:* symlinks hide broken exports maps, missing "files"
      # entries, missing peerDependencies, and node_modules module
      # resolution failures -- all of which only surface once packages are
      # actually installed from tarballs. See tools/e2e-install/README.md.
      - name: Create Verdaccio user and configure .npmrc
        run: |
          TOKEN=$(curl -sf -X PUT http://localhost:4873/-/user/org.couchdb.user:ci \
            -H "Content-Type: application/json" \
            -d '{"name":"ci","password":"ci-throwaway-password"}' \
            | jq -r .token)
          cat > .npmrc <<EOF
          @tokotuku:registry=http://localhost:4873
          registry=http://localhost:4873
          //localhost:4873/:_authToken=${TOKEN}
          EOF

      - name: Run Gate 1 (tarball install)
        run: moon run e2e-install:run
        env:
          REGISTRY_URL: http://localhost:4873

      # Gate 1 only proves "everything installed" works. This is the gate
      # that proves the a-la-carte seam itself, by asserting an optional
      # module's absence leaves zero trace -- a green Gate 1 alone proves
      # nothing about that. See tools/e2e-install/README.md.
      - name: Run Gate 2 (a-la-carte fixture)
        run: moon run e2e-install:fixtures
        env:
          REGISTRY_URL: http://localhost:4873

      # The scenario a real client actually hits: they run with a subset of
      # modules and real data, then add one later. Catches migration
      # numbering regressions Gate 1/2 can't, since both always start fresh.
      - name: Run Gate 2b (add a module later with existing data)
        run: moon run e2e-install:upgrade
        env:
          REGISTRY_URL: http://localhost:4873

      # The golden path a real customer and admin actually walk. Gates
      # 1/2/2b only prove the package graph installs and migrates; none of
      # them click through the application.
      - name: Run Gate 3 (runtime smoke test)
        run: moon run e2e-install:smoke
        env:
          REGISTRY_URL: http://localhost:4873

      # The verification slice of Gate 5: proves `bun update` actually
      # propagates a patch to a client, without touching real npm
      # publishing or claiming the @tokotuku scope on the public registry.
      # See tools/e2e-install/README.md.
      - name: Run Gate 5 (update propagation)
        run: moon run e2e-install:propagation
        env:
          REGISTRY_URL: http://localhost:4873
