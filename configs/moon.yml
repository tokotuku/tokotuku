$schema: "https://moonrepo.dev/schemas/project.json"
language: "typescript"
stack: "frontend"
layer: "configuration"

tasks:
  lint:
    command: "biome check ."
    inputs:
      - "**/*.json"
      - "**/*.ts"

  typecheck:
    command: "tsc --noEmit -p tsconfig.json"
    inputs:
      - "**/*.ts"
      - "tsconfig.json"
