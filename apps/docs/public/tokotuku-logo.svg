<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 128" role="img" aria-labelledby="title desc">
  <title id="title">Tokotuku UI</title>
  <desc id="desc">A Japanese crest-inspired Tokotuku wordmark in sumi black and vermilion.</desc>

  <!--
    Tokotuku logo
    Sumi:       #1C1A18
    Shu-iro:    #D94A32
    Washi:      #F7F2E8

    The crest combines two modular T forms around a central negative-space
    diamond: a quiet reference to reusable UI building blocks and exchange.
  -->
  <g id="mark" transform="translate(12 12)">
    <rect width="104" height="104" rx="25" fill="#D94A32"/>
    <path
      d="M27 29h50M52 29v22M77 75H27M52 53v22"
      fill="none"
      stroke="#F7F2E8"
      stroke-width="13"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <rect x="44.5" y="44.5" width="15" height="15" rx="3" fill="#D94A32" transform="rotate(45 52 52)"/>
  </g>

  <!-- Custom monoline wordmark; no external font dependency. -->
  <g
    id="wordmark"
    transform="translate(148 31)"
    fill="none"
    stroke="#1C1A18"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <!-- t -->
    <path d="M5 14h32M21 3v49c0 9 5 14 14 14"/>
    <!-- o -->
    <rect x="51" y="14" width="43" height="52" rx="21.5"/>
    <!-- k -->
    <path d="M112 3v63M151 15l-39 34M126 37l29 29"/>
    <!-- o -->
    <rect x="169" y="14" width="43" height="52" rx="21.5"/>
    <!-- t -->
    <path d="M226 14h32M242 3v49c0 9 5 14 14 14"/>
    <!-- u -->
    <path d="M276 16v29c0 14 8 21 20 21s20-7 20-21V16"/>
    <!-- k -->
    <path d="M337 3v63M376 15l-39 34M351 37l29 29"/>
    <!-- u -->
    <path d="M395 16v29c0 14 8 21 20 21s20-7 20-21V16"/>
  </g>

  <circle cx="612" cy="93" r="4.5" fill="#D94A32"/>
</svg>
