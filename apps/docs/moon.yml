$schema: "https://moonrepo.dev/schemas/project.json"
language: "typescript"
stack: "frontend"
layer: "application"

dependsOn:
  - "astro"

tasks:
  build:
    command: "astro build"
    inputs:
      - "src/**/*"
      - "astro.config.mjs"
      - "tsconfig.json"
    outputs:
      - "dist"

  dev:
    command: "astro dev"
    options:
      persistent: true
      runInCI: false
      cache: false

  typecheck:
    command: "astro check"
    inputs:
      - "src/**/*"
      - "astro.config.mjs"
      - "tsconfig.json"

  lint:
    command: "biome check ."
    inputs:
      - "src/**/*"
      - "*.mjs"
      - "*.json"
