$schema: "https://moonrepo.dev/schemas/project.json"
language: "typescript"
stack: "frontend"
layer: "application"

tasks:
  dev:
    command: "astro dev"
    options:
      persistent: true
      runInCI: false
      cache: false

  build:
    command: "astro build"
    options:
      cache: false

  typecheck:
    command: "astro check"
    options:
      cache: false

  lint:
    command: "biome check ."
    options:
      cache: false
