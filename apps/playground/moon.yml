$schema: "https://moonrepo.dev/schemas/project.json"
language: "typescript"
stack: "frontend"
layer: "application"

dependsOn:
  - "elements"
  - "theme"

tasks:
  build:
    command: "vite build"
    deps:
      - "elements:build"
      - "theme:build"
    inputs:
      - "src/**/*"
      - "index.html"
      - "vite.config.ts"
    outputs:
      - "dist"

  dev:
    command: "vite"
    options:
      persistent: true
      runInCI: false
      cache: false

  typecheck:
    command: "tsc --noEmit -p tsconfig.json"
    deps:
      - "elements:build"
      - "theme:build"
    inputs:
      - "src/**/*"
      - "tsconfig.json"

  lint:
    command: "biome check ."
    inputs:
      - "src/**/*"
      - "*.ts"
      - "*.html"
      - "*.json"
