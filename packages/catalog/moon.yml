$schema: "https://moonrepo.dev/schemas/project.json"
language: "typescript"
stack: "frontend"
layer: "library"

tasks:
  build:
    command: "tsup"
    inputs:
      - "src/**/*"
      - "tsup.config.ts"
      - "tsconfig.json"
    outputs:
      - "dist"

  lint:
    command: "biome check ."
    inputs:
      - "src/**/*"
      - "*.json"

  typecheck:
    command: "astro check"
    inputs:
      - "src/**/*"
      - "tsconfig.json"

  test:
    # This suite imports bun:sqlite, so force Vitest itself to run under Bun
    # instead of following its Node shebang when Moon launches the task.
    command: "bun --bun vitest run"
    inputs:
      - "src/**/*.test.ts"
