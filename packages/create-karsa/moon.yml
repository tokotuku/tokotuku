$schema: "https://moonrepo.dev/schemas/project.json"
language: "typescript"
stack: "frontend"
layer: "tool"

tasks:
  build:
    command: "tsup"
    inputs:
      # bin.ts is the tsup entry, but it imports args.ts/environment.ts/
      # report.ts/setup.ts/template.ts/wizard.ts -- scoping this to bin.ts
      # alone left moon serving a cached build after editing any of them.
      - "src/**/*.ts"
      - "tsup.config.ts"
      - "tsconfig.json"
    outputs:
      - "dist"

  typecheck:
    command: "tsc --noEmit -p tsconfig.json"
    inputs:
      - "src/**/*.ts"
      - "tsconfig.json"

  test:
    command: "vitest run"
    inputs:
      - "src/**/*.ts"
      - "vitest.config.ts"

  lint:
    command: "biome check ."
    inputs:
      - "src/**/*"
      - "*.json"
