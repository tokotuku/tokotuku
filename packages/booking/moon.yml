$schema: "https://moonrepo.dev/schemas/project.json"
language: "typescript"
stack: "frontend"
layer: "library"

tasks:
  build:
    command: "tsup"
    inputs:
      - "src/**/*"
      - "tsup.config.ts"
      - "tsconfig.json"
    outputs:
      - "dist"

  lint:
    command: "biome check ."
    inputs:
      - "src/**/*"
      - "*.json"

  test:
    # submission-security.test.ts imports bun:sqlite; keep the runner on Bun
    # even when Moon launches the executable directly.
    command: "bun --bun vitest run"
    inputs:
      - "src/**/*"
      - "vitest.config.ts"

  typecheck:
    command: "astro check"
    inputs:
      - "src/**/*"
      - "tsconfig.json"
