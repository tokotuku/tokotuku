$schema: "https://moonrepo.dev/schemas/project.json"
language: "typescript"
stack: "frontend"
layer: "library"

dependsOn:
  - "elements"

tasks:
  typecheck:
    command: "tsc --noEmit -p tsconfig.json"
    deps:
      - "elements:build"
    inputs:
      - "src/**/*"
      - "tsconfig.json"

  lint:
    command: "biome check ."
    inputs:
      - "src/**/*"
      - "*.ts"
      - "*.astro"
      - "*.json"

  test:
    command: "vitest run"
    deps:
      - "elements:build"
    inputs:
      - "src/**/*"
      - "vitest.config.ts"
