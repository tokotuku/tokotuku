$schema: "https://moonrepo.dev/schemas/project.json"
language: "typescript"
stack: "frontend"
layer: "tool"

tasks:
  build:
    command: "tsup"
    inputs:
      - "src/bin.ts"
      - "tsup.config.ts"
      - "tsconfig.json"
    outputs:
      - "dist"

  typecheck:
    command: "tsc --noEmit -p tsconfig.json"
    inputs:
      - "src/bin.ts"
      - "tsconfig.json"

  lint:
    command: "biome check ."
    inputs:
      - "src/**/*"
      - "*.json"
