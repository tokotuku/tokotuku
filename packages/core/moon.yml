$schema: "https://moonrepo.dev/schemas/project.json"
language: "typescript"
stack: "frontend"
layer: "library"

tasks:
  build:
    command: "tsup"
    inputs:
      - "src/**/*"
      - "tsup.config.ts"
      - "tsconfig.json"
    outputs:
      - "dist"

  typecheck:
    command: "astro check"
    inputs:
      - "src/**/*"
      - "tsconfig.json"

  lint:
    command: "biome check ."
    inputs:
      - "src/**/*"
      - "*.ts"
      - "*.json"

  test:
    command: "vitest run"
    inputs:
      - "src/**/*"
      - "vitest.config.ts"
      # skills/ is an input because src/skills.test.ts validates those files.
      # Without it, moon serves a cached pass and a malformed SKILL.md ships
      # silently -- agent tooling ignores a skill it cannot parse, so nothing
      # else would catch it either.
      - "skills/**/*"
