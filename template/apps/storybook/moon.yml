$schema: "https://moonrepo.dev/schemas/project.json"
language: "typescript"
stack: "frontend"
layer: "application"

dependsOn:
  - "ui"

tasks:
  build:
    command: "storybook build"
    deps:
      - "ui:typecheck"
    inputs:
      - ".storybook/**/*"
      - "src/**/*"
      - "package.json"
    outputs:
      - "storybook-static"

  dev:
    command: "storybook dev -p 6006"
    options:
      persistent: true
      runInCI: false
      cache: false

  lint:
    command: "biome check ."
    inputs:
      - ".storybook/**/*"
      - "src/**/*"
      - "*.json"
