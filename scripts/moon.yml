$schema: "https://moonrepo.dev/schemas/project.json"
language: "typescript"
stack: "infrastructure"
layer: "tool"

tasks:
  examples:
    command: "bun run-examples.ts"
    inputs:
      - "run-examples.ts"
    options:
      persistent: true
      runInCI: false
      cache: false

  lint:
    command: "bunx biome check ."
    inputs:
      - "*.ts"

  typecheck:
    command: "bunx tsc --noEmit -p tsconfig.json"
    inputs:
      - "*.ts"
      - "tsconfig.json"
