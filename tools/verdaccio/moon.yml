$schema: "https://moonrepo.dev/schemas/project.json"
language: "unknown"
stack: "infrastructure"

tasks:
  up:
    command: "docker compose -f compose.yaml up -d"
    options:
      cache: false
      runInCI: false

  down:
    command: "docker compose -f compose.yaml down"
    options:
      cache: false
      runInCI: false

  logs:
    command: "docker compose -f compose.yaml logs -f verdaccio"
    options:
      cache: false
      persistent: true
      runInCI: false

  reset:
    command: "docker compose -f compose.yaml down --volumes"
    options:
      cache: false
      runInCI: false
