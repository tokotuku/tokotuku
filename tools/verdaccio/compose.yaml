services:
  verdaccio:
    image: verdaccio/verdaccio:6
    container_name: karsa-verdaccio
    restart: unless-stopped
    ports:
      - "127.0.0.1:4873:4873"
    volumes:
      - ./config.yaml:/verdaccio/conf/config.yaml:ro
      - verdaccio-storage:/verdaccio/storage
    healthcheck:
      # 127.0.0.1, not localhost -- this image's wget resolves "localhost"
      # to ::1 first and fails to connect there even though Verdaccio is
      # listening fine on IPv4, since it never falls back.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4873/-/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    depends_on:
      verdaccio:
        condition: service_healthy
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN}"
    command: ["tunnel", "--no-autoupdate", "run"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  verdaccio-storage:
