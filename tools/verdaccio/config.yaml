storage: /verdaccio/storage

auth:
  htpasswd:
    file: /verdaccio/storage/htpasswd
    # Self-registration is closed -- add team accounts with `npm adduser`
    # (or edit the htpasswd file directly) BEFORE this takes effect, since
    # once it's live `npm adduser` is rejected for everyone. See README.md.
    max_users: -1

uplinks:
  npmjs:
    url: https://registry.npmjs.org/

packages:
  # Private -- domain modules are never published to
  # public npm. Specific patterns must come before the @karsa/* one
  # below: Verdaccio uses the first pattern that matches.
  "@karsa/catalog":
    access: $authenticated
    publish: $authenticated
    unpublish: $authenticated

  "@karsa/orders":
    access: $authenticated
    publish: $authenticated
    unpublish: $authenticated

  "@karsa/booking":
    access: $authenticated
    publish: $authenticated
    unpublish: $authenticated

  "@karsa/content":
    access: $authenticated
    publish: $authenticated
    unpublish: $authenticated

  # Public -- core/ui/auth/config/create-karsa live on real npm once
  # published there; this registry only needs to serve them locally during
  # development (Docker Compose + tools/e2e-install/). No npmjs proxy
  # for this scope, on purpose: every e2e gate publishes a fresh version and
  # resolves it by "latest", and a proxy would let that resolve against the
  # real npm registry's @karsa/* packages instead once they exist there.
  "@karsa/*":
    access: $all
    publish: $authenticated
    unpublish: $authenticated

  "**":
    access: $all
    publish: $authenticated
    unpublish: $authenticated
    proxy: npmjs

middlewares:
  audit:
    enabled: true

log:
  type: stdout
  format: pretty
  level: http
